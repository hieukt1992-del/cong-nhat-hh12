<style>
:root{--navy:#0b2545;--blue:#245cad;--blue2:#e8f0fb;--red:#e5322d;--ink:#0f1b2d;--muted:#5b6b85;--line:#d8e1ee;--bg:#f6f9fd;--card:#fff;--ok:#1d7a4a;--ok2:#e6f4ec;--warn:#b7791f;--warn2:#fdf3e1;--bad:#b3261e;--bad2:#fdecea}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:14px}
.logo b{background:#fff;color:var(--navy);width:30px;height:30px;display:grid;place-items:center;border-radius:6px;font-size:17px;letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{color:#c9d6ea;text-decoration:none;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-radius:6px}
nav a.on{color:#fff;background:rgba(255,255,255,.12)}
.who{font-size:13px;color:#c9d6ea;display:flex;align-items:center;gap:8px}
.who button{background:#fff;color:var(--navy);border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-size:26px;margin:4px 0 14px}
h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:42px;width:100%}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;white-space:nowrap}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:var(--bad2);color:var(--bad);width:38px;height:38px;border-radius:8px;cursor:pointer;font-weight:700;font-size:18px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blue2);color:var(--blue)}
.badge.ok{background:var(--ok2);color:var(--ok)}.badge.warn{background:var(--warn2);color:var(--warn)}.badge.bad{background:var(--bad2);color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:700;color:var(--navy)}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.cahd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cahd .n{display:flex;align-items:center;gap:10px}
.num{background:var(--navy);color:#fff;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px}
.tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn2);padding:2px 7px;border-radius:5px}
.rows{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:26px 1.3fr 90px 1.8fr 1.1fr 1.3fr auto 38px;grid-template-areas:"no gs sl viec vt doi kt x" "no tu tu den h . . .";gap:6px 8px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.r:not(.tc){grid-template-areas:"no gs sl viec vt doi kt x"}
.r>*{min-width:0}
.r .no{grid-area:no;align-self:center;font-weight:700;color:var(--muted);text-align:center}
.r .a1{grid-area:gs}.r .a2{grid-area:viec}.r .a3{grid-area:vt}.r .a4{grid-area:sl}.r .a5{grid-area:tu}.r .a6{grid-area:den}.r .a7{grid-area:h}.r .a8{grid-area:x}.r .a9{grid-area:doi}.r .a10{grid-area:kt}
.r.kt{background:var(--warn2);border-color:#e9c98f}
.r .a11{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.r .a11 img{height:34px;max-width:120px;object-fit:contain;background:#fff;border-radius:4px}
.r.signed{border-color:#9cc3ff;background:#f3f8ff}.r.signed.kt{background:#fff8ea}
.r.ok{border-color:#9fd5b4;background:#f1fbf4}
.r.tl{border-color:#f1a7a7}
.r .mine{font-size:11px;color:var(--blue);font-weight:700}
.dt td{vertical-align:middle}.dt img{height:38px;max-width:110px;object-fit:contain}
.r .ck{flex-direction:row!important;align-items:center;gap:6px;min-height:42px;font-size:13px!important;color:var(--ink)!important;cursor:pointer;white-space:nowrap}
.r .ck input{width:20px;min-height:20px;height:20px;margin:0}
.r .h{font-size:13px;font-weight:700;color:var(--navy);padding-bottom:11px}
.r label{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px}
.r input,.r select{min-height:42px;padding:6px 8px}
.r .a4 input{font-size:18px;font-weight:700;text-align:center}
.cacard .cahd{border-bottom:1px solid var(--line);padding-bottom:10px}
.sec{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 8px;display:flex;gap:8px;align-items:center}
.addrow{width:100%;margin-top:8px;border-style:dashed;color:var(--blue)}
.shoot{display:flex;justify-content:center;align-items:center;width:100%;min-height:50px;font-size:15px;cursor:pointer}
.shoot input{display:none}
.sumline{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.sumline b{color:var(--navy)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ph{position:relative;width:86px;height:86px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#e9eef6}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:6px;border:0;background:rgba(179,38,30,.9);color:#fff;font-weight:700;cursor:pointer}
.ph .w{position:absolute;left:0;right:0;bottom:0;background:rgba(183,121,31,.92);color:#fff;font-size:10px;padding:1px 4px;font-weight:700}
.up{width:86px;height:86px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;background:#fff}
.up input{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15}
.bar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1;font-size:13px;min-width:160px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:var(--blue2)}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.tw table{border:0}
.gs{border-left:0}
.err{background:var(--bad2);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.err ul{margin:4px 0 0 18px;padding:0}
.lb{position:fixed;inset:0;background:rgba(5,15,30,.9);z-index:50;display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:86vh;border-radius:8px}
.lb button{position:absolute;top:14px;right:14px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
.demo{background:var(--warn2);color:var(--warn);font-size:12px;font-weight:600;text-align:center;padding:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gal img{width:100%;height:140px;object-fit:cover;display:block;cursor:zoom-in}
.gal figcaption{font-size:11px;padding:5px 7px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.step{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:58px}
.step .sn{font-weight:700;color:var(--navy);font-size:15px}
.step .sn i{font-style:normal;font-size:10px;background:var(--red);color:#fff;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.step .st{font-size:12px;color:var(--muted)}
.step .ss{font-size:12px;font-weight:600;color:var(--blue)}
.step.on{border:2px solid var(--navy);background:var(--blue2)}
.step.done .ss{color:var(--ok)}
.step.lock{background:#eef2f7;cursor:not-allowed}
.step.lock .sn,.step.lock .ss{color:#8a97ab}
.today{font-size:16px;font-weight:700;color:#fff;background:var(--navy);padding:8px 14px;border-radius:8px}
#dash{background:#fff;padding:12px;overflow-x:auto}
.ptitle{font-size:18px;font-weight:700;color:var(--navy);text-align:center;margin:4px 0 12px}
.pt{border-collapse:collapse;width:100%;min-width:720px;font-size:14px;color:var(--ink)}
.pt th,.pt td{border:1px solid #9aa9c0;padding:7px 9px;text-align:left;vertical-align:middle}
.pt thead th{background:var(--navy);color:#fff;font-weight:600;font-size:13px}
.pt .n{text-align:right;width:46px;white-space:nowrap}
.pt .c{text-align:center;width:80px}
.pt tr.grp td{background:#e8f0fb;font-weight:700;color:var(--navy)}
.pad{width:100%;height:180px;border:1.5px dashed var(--blue);border-radius:10px;background:#fff;touch-action:none;display:block}
.modal{position:fixed;inset:0;background:rgba(5,15,30,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal>div{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 8px;color:var(--navy)}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #9aa9c0;margin-top:14px}
.sigs>div{padding:8px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.sigs>div+div{border-left:1px solid #9aa9c0}
.sigs .t{font-weight:700;font-size:13px;color:var(--navy)}
.sigs img{max-height:80px;max-width:100%;object-fit:contain}
.sigs .nm{font-weight:700;font-size:13px}.sigs .tm{font-size:11px;color:var(--muted)}
nav a .cnt{background:var(--red);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.kcard{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
@media print{header,.noprint,.bar,.demo{display:none!important}main{padding:0;max-width:none}#dash{border:0;padding:0}.tw{overflow:visible}.board{min-width:0}}
@media (max-width:820px){
 .r,.r:not(.tc){grid-template-columns:1fr 1fr 84px 42px;grid-template-areas:"gs gs sl x" "viec viec viec viec" "vt vt vt vt" "doi doi doi doi" "kt kt kt kt"}
 .r.tc{grid-template-areas:"gs gs sl x" "viec viec viec viec" "vt vt vt vt" "doi doi doi doi" "kt kt kt kt" "tu den h h"}
 .r .no{display:none}
 .grid2{grid-template-columns:1fr}
 .steps{grid-template-columns:1fr 1fr}
 h1{font-size:22px}
 nav{flex-wrap:nowrap;overflow-x:auto;order:3;flex-basis:100%}
 nav a{padding:6px 8px;font-size:12px;white-space:nowrap}
 .who{margin-left:auto}
}

/* trạng thái khấu trừ của 1 ngày */
const KT_ST = {cho_duyet:'Chờ duyệt khấu trừ', da_duyet:'Đã duyệt khấu trừ', tra_lai:'Bị trả lại', cu:'Đã chốt (quy trình cũ)'};

const newId = () => 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function rowSt(d,r){ return 'duyet'; }   // đã bỏ ký & duyệt: dòng đã lưu là có hiệu lực
const rowOK = (d,r) => rowSt(d,r)==='duyet';
function allRows(d){ const out=[]; CAS.forEach(c=>(d?.ca?.[c.k]?.rows||[]).forEach(r=>out.push({r,c}))); return out; }
function dayCounts(d){ const o={n:0,nhap:0,ky:0,duyet:0,tl:0}; allRows(d).forEach(({r})=>{ o.n++; o[rowSt(d,r)]++; }); return o; }
function ktSplit(d){ let ok=0,cho=0; allRows(d).forEach(({r,c})=>{ if(!r.kt) return; const q=rowQD(r,c); if(rowOK(d,r)) ok+=q; else cho+=q; }); return {ok,cho}; }
const sigKey = s => { let h=5381; for(let i=0;i<s.length;i+=7) h=((h<<5)+h+s.charCodeAt(i))|0; return 'k'+(h>>>0).toString(36)+s.length.toString(36); };
const sigSrc = (d,o) => o ? (o.sig || d?.sigImg?.[o.s] || '') : '';
const fdt = t => t ? new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'}) : '';
function stBadge(d){
  const c=dayCounts(d);
  if(d?.locked) return '<span class="badge ok">Đã chốt</span>';
  if(c.n) return `<span class="badge ok">Đã khai báo ${c.n} dòng</span>`;
  return d?.updatedAt ? '<span class="badge warn">Nháp</span>' : '<span class="badge">Chưa khai báo</span>';
}
const stText = d => d?.locked ? 'Đã chốt' : (dayCounts(d).n ? 'Đã khai báo' : 'Chưa khai báo');

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const vn = s => s ? s.split('-').reverse().join('/') : '';
const thu = s => ['CN','T2','T3','T4','T5','T6','T7'][new Date(s+'T00:00').getDay()];
const addDays = (s,n) => { const d=new Date(s+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const fmt = n => (Math.round((+n||0)*100)/100).toLocaleString('vi-VN');
function hrs(tu,den){
  if(!tu||!den) return 0;
  const [a,b]=tu.split(':').map(Number),[c,d]=den.split(':').map(Number);
  let x=a*60+b, y=c*60+d; if(y<x) y+=1440;
  return Math.round((y-x)/60*100)/100;
}
function blankDay(date){
  const ca={}; CAS.forEach(c=>ca[c.k]={rows:[],note:''});
  return {date, ca, locked:false, note:'', photos:{sang:0,tc_trua:0,chieu:0,tc_toi:0}};
}
function caSum(day,k){
  let sl=0,gc=0; (day?.ca?.[k]?.rows||[]).forEach(r=>{const n=+r.sl||0; sl+=n; gc+=n*hrs(r.tu,r.den);});
  return {sl, gc:Math.round(gc*100)/100};
}
/* giờ của 1 dòng: ca Sáng/Chiều luôn theo giờ ca trong Cài đặt; tăng ca theo giờ nhập */
const rowT = (r,c) => c.tc ? [r.tu||'',r.den||''] : (S.settings?.hours?.[c.k] || [r.tu,r.den]);
/* công quy đổi của 1 dòng: ca chính 0,5 công/người; tăng ca = người×giờ/8 × hệ số tăng ca (mặc định 1,5) */
const HS = () => +(S.settings?.heSoTC) || 1.5;
const rowQD = (r,c) => c.tc ? (+r.sl||0)*hrs(r.tu,r.den)/8*HS() : (+r.sl||0)/2;
function daySum(day){
  const s=caSum(day,'sang'),t=caSum(day,'tc_trua'),c=caSum(day,'chieu'),o=caSum(day,'tc_toi');
  const congHC=(s.sl+c.sl)/2, gioTC=t.gc+o.gc;
  const ph=day?.photos||{}; const anh=(ph.sang||0)+(ph.tc_trua||0)+(ph.chieu||0)+(ph.tc_toi||0);
  let ktQD=0; CAS.forEach(x=>(day?.ca?.[x.k]?.rows||[]).forEach(r=>{ if(r.kt) ktQD+=rowQD(r,x); }));
  return {sang:s.sl,chieu:c.sl,tcTruaSL:t.sl,tcTruaGio:t.gc,tcToiSL:o.sl,tcToiGio:o.gc,congHC,gioTC,congQD:congHC+gioTC/8*HS(),ktQD,anh};
}
const money = n => Math.round(+n||0).toLocaleString('vi-VN')+' đ';

let api;
async function initStore(){
  if(DEMO){ api = demoApi(); return; }
  const G='https://www.gstatic.com/firebasejs/10.14.1/';
  const [{initializeApp},A,F] = await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-auth.js'),import(G+'firebase-firestore.js')]);
  const app=initializeApp(FIREBASE_CONFIG), auth=A.getAuth(app), fs=F.getFirestore(app);
  const d=(c,id)=>F.doc(fs,c,id);
  api = {
    onUser: cb => A.onAuthStateChanged(auth, u => cb(u ? {email:u.email.toLowerCase(), name:u.displayName||u.email} : null)),
    async login(){ const p=new A.GoogleAuthProvider(); try{ await A.signInWithPopup(auth,p);}catch(e){ if(/popup/i.test(e.code||'')) await A.signInWithRedirect(auth,p); else throw e; } },
    logout: () => A.signOut(auth),
    async getUser(email){ const s=await F.getDoc(d('cn_users',email)); return s.exists()?s.data():null; },
    async listUsers(){ const q=await F.getDocs(F.collection(fs,'cn_users')); return q.docs.map(x=>({email:x.id,...x.data()})); },
    saveUser: (email,o) => F.setDoc(d('cn_users',email),o),
    delUser: email => F.deleteDoc(d('cn_users',email)),
    async getSettings(){ const s=await F.getDoc(d('cn_meta','settings')); return s.exists()?s.data():null; },
    saveSettings: o => F.setDoc(d('cn_meta','settings'),o),
    async getDay(date){ const s=await F.getDoc(d('cn_days',date)); return s.exists()?s.data():null; },
    saveDay: (date,o) => F.setDoc(d('cn_days',date),o,{merge:true}),
    async listDays(a,b){ const q=await F.getDocs(F.query(F.collection(fs,'cn_days'),F.where('date','>=',a),F.where('date','<=',b))); return q.docs.map(x=>x.data()); },
    async listDaysBySt(st){ const q=await F.getDocs(F.query(F.collection(fs,'cn_days'),F.where('ktSt','==',st))); return q.docs.map(x=>x.data()); },
    async getMine(email){ if(email.startsWith('khach:')) return localMine(); const s=await F.getDoc(d('cn_sigs',email)); return s.exists()?s.data():{}; },
    saveMine: async (email,o) => { if(email.startsWith('khach:')) return saveLocalMine(o); return F.setDoc(d('cn_sigs',email),{...o,at:Date.now()},{merge:true}); },
    async listDaysGt(f){ const q=await F.getDocs(F.query(F.collection(fs,'cn_days'),F.where(f,'>',0))); return q.docs.map(x=>x.data()); },
    mergeDay: (date,fn) => F.runTransaction(fs, async tx => { const ref=d('cn_days',date); const sn=await tx.get(ref); const cur=sn.exists()?sn.data():null; const o=fn(cur); tx.set(ref,o,{merge:true}); return o; }),
    async listPhotos(date){ const q=await F.getDocs(F.query(F.collection(fs,'cn_photos'),F.where('date','==',date))); return q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.at-b.at); },
    async listPhotosRange(a,b){ const q=await F.getDocs(F.query(F.collection(fs,'cn_photos'),F.where('date','>=',a),F.where('date','<=',b))); return q.docs.map(x=>({id:x.id,...x.data()})); },
    async listPhotosBefore(d){ const q=await F.getDocs(F.query(F.collection(fs,'cn_photos'),F.where('date','<',d),F.limit(300))); return q.docs.map(x=>({id:x.id,date:x.data().date})); },
    async addPhoto(p){ const r=await F.addDoc(F.collection(fs,'cn_photos'),p); return r.id; },
    delPhoto: id => F.deleteDoc(d('cn_photos',id)),
  };
}
function demoApi(){
  const K='cnhh12_demo';
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(K))||{}; }catch{ return {}; } };
  const st=Object.assign({days:{},photos:{},users:{},settings:null},load());
  const save=()=>{ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){ toast('Bộ nhớ trình duyệt đầy (chế độ demo) — xoá bớt ảnh.','bad'); } };
  const deep=(a,b)=>{ for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){ a[k]=deep(a[k]&&typeof a[k]==='object'?a[k]:{},b[k]); } else a[k]=b[k]; } return a; };
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  return {
    onUser: cb => cb({email:ADMIN_EMAILS[0], name:'Lê Quang Hiếu (demo)'}),
    login: async()=>{}, logout: async()=>{ alert('Chế độ demo: không có đăng xuất.'); },
    getUser: async e => clone(st.users[e])||null,
    listUsers: async () => Object.entries(st.users).map(([email,o])=>({email,...o})),
    saveUser: async (e,o) => { st.users[e]=o; save(); },
    delUser: async e => { delete st.users[e]; save(); },
    getSettings: async () => clone(st.settings),
    saveSettings: async o => { st.settings=clone(o); save(); },
    getDay: async date => clone(st.days[date])||null,
    saveDay: async (date,o) => { st.days[date]=deep(st.days[date]||{},clone(o)); save(); },
    listDays: async (a,b) => Object.values(st.days).filter(x=>x.date>=a&&x.date<=b).map(clone),
    listDaysBySt: async k => Object.values(st.days).filter(x=>x.ktSt===k).map(clone),
    getMine: async e => clone((st.sigs||{})[e])||{},
    saveMine: async (e,o) => { st.sigs=st.sigs||{}; st.sigs[e]={...(st.sigs[e]||{}),...clone(o)}; save(); },
    listDaysGt: async f => Object.values(st.days).filter(x=>(+x[f]||0)>0).map(clone),
    mergeDay: async (date,fn) => { const o=fn(clone(st.days[date])||null); st.days[date]=deep(st.days[date]||{},clone(o)); save(); return o; },
    listPhotos: async date => Object.entries(st.photos).filter(([,p])=>p.date===date).map(([id,p])=>({id,...p})).sort((a,b)=>a.at-b.at),
    listPhotosRange: async (a,b) => Object.entries(st.photos).filter(([,p])=>p.date>=a&&p.date<=b).map(([id,p])=>({id,...p})),
    listPhotosBefore: async d => Object.entries(st.photos).filter(([,p])=>p.date<d).map(([id,p])=>({id,date:p.date})),
    addPhoto: async p => { const id='p'+Date.now()+Math.random().toString(36).slice(2,6); st.photos[id]=p; save(); return id; },
    delPhoto: async id => { delete st.photos[id]; save(); },
  };
}

function route(){
  if(!S.user) return;

  let t=(location.hash.slice(2)||'').split('/')[0];
  const ok=TABS.find(x=>x[0]===t&&x[2]());
  if(!ok){ location.hash = can.write()?'#/khai-bao':'#/phan-cong'; return; }
  const arg=(location.hash.slice(2)||'').split('/')[1]||'';
  ({'khai-bao':viewKhaiBao,'phan-cong':viewPhanCong,'anh':viewAnh,'duyet':viewDuyet,'tong-hop':viewTongHop,'cai-dat':viewCaiDat})[t](arg);
}

async function loadDay(date){
  S.date=date;
  const [d,p]=await Promise.all([api.getDay(date),api.listPhotos(date)]);
  S.day = Object.assign(blankDay(date), d||{});
  CAS.forEach(c=>{ S.day.ca[c.k]=Object.assign({rows:[],note:''},S.day.ca?.[c.k]||{}); });
  normRows(S.day); allRows(S.day).forEach(({r})=>{ r._saved=true; }); S.del=new Set();
  S.photos=p; S.dirty=false;
}

function statsHtml(){
  const s=daySum(S.day);
  return `<div class="sumline">Cả ngày: Sáng <b>${s.sang}</b> · Chiều <b>${s.chieu}</b> · Tăng ca <b>${fmt(s.gioTC)}</b> giờ · Quy đổi <b>${fmt(s.congQD)}</b> công${s.ktQD?` · Trừ đội <b>${fmt(s.ktQD)}</b> công`:''}</div>`;
}
/* ca hiện tại theo giờ khai báo */
const nowHM = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
function currentCa(){ const t=nowHM(); let k=CAS[0].k; CAS.forEach(c=>{ if(t>=S.settings.hours[c.k][0]) k=c.k; }); return k; }
function caOpen(k){
  if(can.admin() || S.date<today()) return true;
  return CAS.findIndex(c=>c.k===k) <= CAS.findIndex(c=>c.k===currentCa());
}
const caDone = k => caSum(S.day,k).sl>0 && S.photos.some(p=>p.ca===k);
function stepsHtml(){
  const cur = S.date===today() ? currentCa() : null;
  return CAS.map(c=>{
    const open=caOpen(c.k), sm=caSum(S.day,c.k), ph=S.photos.filter(p=>p.ca===c.k).length, h=S.settings.hours[c.k], done=caDone(c.k);
    const sub = !open ? 'Chưa đến giờ' : sm.sl ? `${sm.sl} người · ${ph} ảnh` : 'Chưa khai báo';
    return `<button class="step${c.k===S.caSel?' on':''}${open?'':' lock'}${done?' done':''}" data-step="${c.k}" ${open?'':'disabled'}>
      <span class="sn">${c.n}${c.k===cur?'<i>BÂY GIỜ</i>':''}</span><span class="st">${h[0]}–${h[1]}</span><span class="ss">${done?'✓ ':''}${sub}</span></button>`;
  }).join('');
}

  $('#unlock')&&($('#unlock').onclick=async()=>{ if(!confirm('Mở chốt ngày '+vn(S.date)+' để sửa?'+(ktState(S.day)==='da_duyet'?' Phần duyệt khấu trừ sẽ bị huỷ, người khai báo phải ký lại.':''))) return;

function dirty(){ S.dirty=true; toast('Có thay đổi chưa lưu','warn'); }
function rerenderCa(k){ const el=$('#ca-'+k); if(el){ const i=CAS.findIndex(c=>c.k===k); el.outerHTML=caCard(CAS[i],i); } $('#stats').innerHTML=statsHtml(); $('#steps')&&($('#steps').innerHTML=stepsHtml()); }

function rowErrs(c,r,i){
  const errs=[], p=`${c.n} – dòng ${i+1}:`;
  if(!(+r.sl>0)) errs.push(`${p} chưa nhập số lượng người.`);
  if(!r.gs) errs.push(`${p} chưa có tên giám sát.`);
  if(!String(r.viec||'').trim()) errs.push(`${p} chưa ghi công việc.`);
  if(!r.tu||!r.den) errs.push(`${p} thiếu giờ Từ/Đến.`);
  if(r.kt && !r.doi) errs.push(`${p} có tick khấu trừ nhưng chưa chọn đội.`);
  if(r.kt && r.doi==='BCH') errs.push(`${p} BCH không khấu trừ — bỏ tick hoặc chọn đúng đội.`);
  if(S.settings.photoRequired && !S.photos.some(x=>x.ca===c.k) && !(S.day.photos?.[c.k]>0)) errs.push(`${c.n}: chưa có ảnh công nhật — chụp ảnh ca này trước khi ký.`);
  return errs;
}
const cleanRow = (r,c) => ({id:r.id||newId(),by:r.by||S.user.email,gs:r.gs||'',viec:String(r.viec||'').trim(),vitri:String(r.vitri||'').trim(),doi:r.doi||'',kt:!!r.kt,sl:+r.sl||0,tu:rowT(r,c)[0],den:rowT(r,c)[1],ky:r.ky||null,tl:r.tl||null});
/* gộp: chỉ ghi đè những dòng mình được sửa, giữ nguyên dòng của giám sát khác */
function mergeRows(srv,loc,del,cur,c){
  const okEdit=()=>can.admin();   // dòng đã có trên hệ thống chỉ quản trị được ghi đè / xoá
  const L=new Map(loc.map(r=>[r.id,r])), out=[];
  srv.forEach(sr=>{ if(del.has(sr.id)&&okEdit(sr)) return; out.push(L.has(sr.id)&&okEdit(sr)?cleanRow(L.get(sr.id),c):sr); });
  const ids=new Set(srv.map(r=>r.id)); loc.forEach(r=>{ if(!ids.has(r.id)) out.push(cleanRow(r,c)); });
  return out;
}
function counts(o){ let pend=0,tl=0; CAS.forEach(c=>(o.ca[c.k].rows||[]).forEach(r=>{ if(r.ky&&!o.duyet?.[r.id]) pend++; if(r.tl&&!r.ky) tl++; })); return {pendN:pend,tlN:tl}; }
async function saveDay(quiet, extra){
  const date=S.date, loc=S.day, del=S.del||new Set();
  try{
    const o=await api.mergeDay(date, cur=>{
      cur=normRows(cur||blankDay(date));
      const ca={}; CAS.forEach(c=>{ ca[c.k]={rows:mergeRows(cur.ca?.[c.k]?.rows||[], loc.ca[c.k].rows, del, cur, c), note:loc.ca[c.k].note||cur.ca?.[c.k]?.note||''}; });
      const o={date, ca, note:loc.note||'', updatedAt:Date.now(), updatedBy:S.user.name, ...(extra||{})};
      return Object.assign(o, counts({ca,duyet:cur.duyet}));
    });
    await loadDay(date); viewKhaiBao(); refreshPend();
    if(!quiet) toast('Đã lưu '+new Date().toLocaleTimeString('vi-VN'),'ok');
    return o;
  }catch(e){ toast('Lỗi lưu: '+(e.message||e),'bad'); }
}

async function signRow(k,i){
  const c=CAS.find(x=>x.k===k), r=S.day.ca[k].rows[i];
  const errs=rowErrs(c,r,i);
  if(errs.length){ $('#errs').innerHTML=`<div class="err"><b>Chưa ký được, cần bổ sung:</b><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`; $('#errs').scrollIntoView({behavior:'smooth'}); return; }
  $('#errs').innerHTML='';
  const dg=+S.settings.donGia||0, q=rowQD(r,c);
  const sig=await askSign(`<p style="font-size:14px;margin:0 0 6px">${c.n} ${rowT(r,c).join('–')} · <b>${r.sl} người</b> · ${esc(r.viec)}${r.vitri?' – '+esc(r.vitri):''}</p>
    <p style="font-size:13px;margin:0">${r.kt?`Khấu trừ đội <b>${esc(r.doi)}</b>: ${fmt(q)} công = <b>${money(q*dg)}</b>.`:`Công nhật BCH/chung: ${fmt(q)} công.`} Ký xong dòng này khoá lại và chuyển quản trị duyệt.</p>`,'Ký xác nhận phân công'); if(!sig) return;
  const key=sigKey(sig);
  r.ky={name:S.me?.gsName||S.user.name,email:S.user.email,s:key,at:Date.now()}; r.tl=null; if(!r.by) r.by=S.user.email;
  await saveDay(true,{sigImg:{[key]:sig}});
  toast('Đã ký, chờ quản trị duyệt','ok');
}

/* ============ CHỮ KÝ & GỬI DUYỆT ============ */
function sigPad(host){
  host.innerHTML='<canvas class="pad" aria-label="Khung ký tên"></canvas><div class="row" style="margin-top:8px;align-items:center"><button type="button" class="btn sm" data-clear>Xoá, ký lại</button><span class="muted">Dùng ngón tay hoặc chuột ký trong khung.</span></div>';
  const cv=host.querySelector('canvas'),ctx=cv.getContext('2d');
  let drawing=false,dirty=false,last=null,bb=null;
  const fit=()=>{const r=cv.getBoundingClientRect(),k=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*k));cv.height=Math.max(1,Math.round(r.height*k));ctx.setTransform(k,0,0,k,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f5c';};
  requestAnimationFrame(fit);
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  const grow=p=>{bb=bb?[Math.min(bb[0],p[0]),Math.min(bb[1],p[1]),Math.max(bb[2],p[0]),Math.max(bb[3],p[1])]:[p[0],p[1],p[0],p[1]];};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();if(cv.width<=1)fit();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);grow(last);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fillStyle='#0b1f5c';ctx.fill();dirty=true;});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();grow(p);last=p;});
  const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  host.querySelector('[data-clear]').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false;bb=null;};
  return {empty:()=>!dirty||!bb||(bb[2]-bb[0]<12&&bb[3]-bb[1]<12),data:()=>{
    const k=window.devicePixelRatio||1,pd=6;
    const x=Math.max(0,(bb[0]-pd)*k),y=Math.max(0,(bb[1]-pd)*k),w=Math.min(cv.width-x,(bb[2]-bb[0]+2*pd)*k),h=Math.min(cv.height-y,(bb[3]-bb[1]+2*pd)*k);
    const s=Math.min(1,380/w),o=document.createElement('canvas');o.width=Math.max(1,Math.round(w*s));o.height=Math.max(1,Math.round(h*s));
    o.getContext('2d').drawImage(cv,x,y,w,h,0,0,o.width,o.height);return o.toDataURL('image/png');}};
}
function modal(html){
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(m); return m;
}
/* mở khung ký; trả về ảnh chữ ký (dataURL) hoặc null nếu huỷ */
async function askSign(intro,title='Ký xác nhận'){
  let saved=''; try{ saved=(await api.getMine(S.user.email)).sig||''; }catch(e){}
  return new Promise(res=>{
    const m=modal(`<h3>${title}</h3>${intro}
      ${saved?`<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="radio" name="sm" value="saved" checked style="width:20px;min-height:20px"> Dùng chữ ký đã lưu</label><div id="svd" style="text-align:center"><img src="${saved}" alt="Chữ ký đã lưu" style="max-height:80px"></div>
        <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="radio" name="sm" value="new" style="width:20px;min-height:20px"> Ký mới</label>`:''}
      <div id="padw" ${saved?'hidden':''}><div id="pad"></div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px"><input type="checkbox" id="keep" checked style="width:20px;min-height:20px"> Lưu chữ ký này để lần sau ký nhanh</label></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x>Huỷ</button><button class="btn ok" data-ok>Ký &amp; gửi</button></div>`);
    let pad=null; const showPad=()=>{ m.querySelector('#padw').hidden=false; if(!pad) pad=sigPad(m.querySelector('#pad')); };
    if(!saved) showPad();
    m.querySelectorAll('[name=sm]').forEach(r=>r.onchange=()=>{ if(r.value==='new'&&r.checked) showPad(); else m.querySelector('#padw').hidden=true; });
    const done=v=>{ m.remove(); res(v); };
    m.querySelector('[data-x]').onclick=()=>done(null);
    m.querySelector('[data-ok]').onclick=async()=>{
      const useSaved=saved && m.querySelector('[name=sm]:checked')?.value==='saved';
      if(useSaved) return done(saved);
      if(!pad||pad.empty()){ alert('Chưa ký vào khung.'); return; }

function loadImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }
async function compress(file,label){
  const url=URL.createObjectURL(file); const img=await loadImg(url); URL.revokeObjectURL(url);
  let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,1280/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d'); x.drawImage(img,0,0,w,h);
  const fs=Math.max(14,Math.round(w/42)), p=Math.round(fs*.45); x.font=`600 ${fs}px sans-serif`; x.textBaseline='top';
  const tw=x.measureText(label).width; x.fillStyle='rgba(11,37,69,.78)'; x.fillRect(0,h-fs-p*2,tw+p*2,fs+p*2); x.fillStyle='#fff'; x.fillText(label,p,h-fs-p);
  let q=.72, out=cv.toDataURL('image/jpeg',q); while(out.length>850000&&q>.3){ q-=.12; out=cv.toDataURL('image/jpeg',q); }
  return out;
}
async function upload(input){

  if(old.length){ toast(`Có ${old.length} ảnh chụp từ ngày khác — không dùng ảnh cũ, chụp mới tại công trường.`,'bad'); if(old.length===files.length) return; }

}

  // Sheet 5: ảnh công nhật — mỗi ảnh 1 dòng, kèm việc trong ca để QS đối chiếu
  const w5=wb.addWorksheet('Anh cong nhat',{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  head(w5,'ẢNH CÔNG NHẬT (ĐỐI CHIẾU)',sub,[['STT',6],['Ngày',12],['Ca',9],['Giờ chụp',14],['Người chụp',18],['Phân công trong ca (GS · SL · việc · đội)',46],['Ảnh',52]]);
  if(!photos.length){ w5.getCell(5,1).value='Không có ảnh nào trong khoảng ngày này (ảnh chỉ lưu '+(+S.settings.photoKeep||60)+' ngày gần nhất).'; w5.getCell(5,1).font={italic:true,color:{argb:'FFB3261E'}}; }
  const dayMap=Object.fromEntries(days.map(d=>[d.date,d]));
  for(let i=0;i<photos.length;i++){ const p=photos[i], r=5+i, c=CAS.find(x=>x.k===p.ca)||{n:p.ca};
    if(i%10===0) toast(`Đang chèn ảnh ${i+1}/${photos.length}…`);
    const rows=(dayMap[p.date]?.ca?.[p.ca]?.rows||[]).map(x=>`${x.gs} · ${x.sl} người · ${x.viec}${x.vitri?' – '+x.vitri:''}${x.doi?' · '+x.doi+(x.kt?' (trừ đội)':''):''}`).join('\n');
    w5.getRow(r).values=[i+1,vn(p.date),c.n,p.takenAt?new Date(p.takenAt).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'',p.by||'',rows||'(chưa có phân công)',''];
    w5.getRow(r).height=165; for(let k=1;k<=7;k++){ w5.getCell(r,k).alignment={vertical:'top',wrapText:true}; w5.getCell(r,k).border=B; }
    const im=await shrink(p.data); if(!im) continue;
    const id=wb.addImage({base64:im.b64,extension:'jpeg'}), H=210, W=Math.round(im.w*H/im.h);
    w5.addImage(id,{tl:{col:6.05,row:r-1+0.03},ext:{width:Math.min(W,360),height:Math.min(W,360)===W?H:Math.round(360*im.h/im.w)},editAs:'oneCell'});
  }

  const buf=await wb.xlsx.writeBuffer();
  const name=`HH12_CONG-NHAT_${S.sumFrom.replace(/-/g,'')}-${S.sumTo.replace(/-/g,'')}.xlsx`;
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:name,data:buf}); toast('Đã xuất Excel','ok'); }catch(e){ toast(e.code==='declined'?'Đã huỷ tải file':'Không tải được: '+(e.message||e.code),'warn'); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('Đã xuất Excel','ok');
}

/* ============ 5. CÀI ĐẶT ============ */
async function viewCaiDat(){
  const users=await api.listUsers(); const s=S.settings;
  shell(`<div class="eyebrow">Quản trị</div><h1>Cài đặt</h1>
  <div class="grid2">
  <section class="card"><h2>Danh sách giám sát</h2><p class="muted">Mỗi dòng 1 người: <b>Họ tên | phụ trách</b></p>
    <textarea id="gs" rows="7">${esc(s.gs.map(g=>g.name+(g.note?' | '+g.note:'')).join('\n'))}</textarea>
    <h2 style="margin-top:14px">Công việc hay dùng</h2><p class="muted">Mỗi dòng 1 việc — hiện gợi ý khi gõ.</p>
    <textarea id="viec" rows="6">${esc(s.viec.join('\n'))}</textarea>
    <h2 style="margin-top:14px">Đội thi công</h2><p class="muted">Đồng bộ với web thiết bị HH12 — mỗi dòng 1 đội.</p>
    <textarea id="doi" rows="8">${esc(s.doi.join('\n'))}</textarea></section>
  <section class="card"><h2>Giờ mặc định từng ca</h2><p class="muted">Tự điền khi thêm dòng, sửa được ở từng dòng.</p>
    ${CAS.map(c=>`<div class="row" style="margin-bottom:8px"><span style="width:80px;padding-bottom:10px;font-weight:600">${c.n}</span><label class="f" style="width:120px">Từ<input type="time" id="h1-${c.k}" value="${s.hours[c.k][0]}"></label><label class="f" style="width:120px">Đến<input type="time" id="h2-${c.k}" value="${s.hours[c.k][1]}"></label></div>`).join('')}
    <label class="f" style="margin-top:10px;max-width:260px">Đơn giá công nhật để tính khấu trừ (đ/công)<input type="number" id="dg" min="0" step="1000" value="${+s.donGia||0}"></label>
    <label class="f" style="margin-top:10px;max-width:260px">Hệ số tăng ca (TC trưa, TC tối)<input type="number" id="hstc" min="1" step="0.1" value="${+s.heSoTC||1.5}"></label>
    <label class="f" style="margin-top:10px;max-width:260px">Giữ ảnh trong (ngày) — để QS đối chiếu khi xuất Excel, nên ≥ 45<input type="number" id="pkeep" min="1" value="${+s.photoKeep||60}"></label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="preq" style="width:20px;min-height:20px" ${s.photoRequired?'checked':''}> Bắt buộc có ảnh mỗi ca có người mới được chốt ngày</label>
    <div class="row" style="margin-top:14px"><button class="btn pri" id="saveS">Lưu cài đặt</button><span id="msg"></span></div></section>
  </div>
  <section class="card"><h2>Người dùng được vào web</h2><p class="muted">Ai đăng nhập bằng tài khoản Google lần đầu sẽ tự vào danh sách với quyền <b>Khai báo công nhật</b> (ghi chú "tự đăng ký"). Muốn hạn chế thì đổi vai trò thành "Chỉ xem" hoặc "Chặn".</p>
    <div class="row" style="margin:10px 0">
      <label class="f" style="flex:2;min-width:200px">Email Google<input id="ue" type="email" placeholder="ten@gmail.com"></label>
      <label class="f" style="flex:2;min-width:160px">Họ tên<input id="un"></label>
      <label class="f" style="flex:1;min-width:170px">Vai trò<select id="ur">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k==='khaibao'?'selected':''}>${v}</option>`).join('')}</select></label>
      <button class="btn blue" id="uadd">Thêm</button></div>
    <div class="tw"><table><tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th></th></tr>
      ${ADMIN_EMAILS.map(e=>`<tr><td>${esc(e)}</td><td>—</td><td>Quản trị gốc</td><td></td></tr>`).join('')}
      ${users.filter(u=>!ADMIN_EMAILS.includes(u.email)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(u=>`<tr><td>${esc(u.email)}${u.auto?' <span class="muted">· tự đăng ký</span>':''}</td><td>${esc(u.name)}</td><td><select data-urole="${esc(u.email)}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="btn sm" data-udel="${esc(u.email)}">Xoá</button></td></tr>`).join('')}
    </table></div></section>`);
  $('#saveS').onclick=async()=>{
    const gs=$('#gs').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [n,...r]=l.split('|'); return {name:n.trim(),note:r.join('|').trim()}; });
    const hours={}; CAS.forEach(c=>hours[c.k]=[$('#h1-'+c.k).value,$('#h2-'+c.k).value]);
    S.settings={gs,hours,viec:$('#viec').value.split('\n').map(x=>x.trim()).filter(Boolean),doi:$('#doi').value.split('\n').map(x=>x.trim()).filter(Boolean),donGia:Math.max(0,+$('#dg').value||0),heSoTC:Math.max(1,+$('#hstc').value||1.5),photoKeep:Math.max(1,+$('#pkeep').value||1),photoRequired:$('#preq').checked};
    await api.saveSettings(S.settings); toast('Đã lưu cài đặt','ok');
  };
  $('#uadd').onclick=async()=>{ const e=$('#ue').value.trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(e)){ toast('Email không hợp lệ','bad'); return; }
    await api.saveUser(e,{name:$('#un').value.trim()||e,role:$('#ur').value}); viewCaiDat(); };
  $('main').addEventListener('change',async ev=>{ const e=ev.target.dataset.urole; if(!e) return; const u=users.find(x=>x.email===e); const {email,...rest}=u; await api.saveUser(e,{...rest,role:ev.target.value}); toast('Đã đổi quyền '+e,'ok'); });
  $('main').addEventListener('click',async ev=>{ const e=ev.target.dataset.udel; if(e&&confirm('Xoá quyền của '+e+'?')){ await api.delUser(e); viewCaiDat(); } });
}

/* ============ KHỞI ĐỘNG ============ */
/* ===== khách (không đăng nhập) — giống web thiết bị ===== */
function devId(){ let v=''; try{ v=localStorage.getItem('cn_dev')||''; if(!v){ v=Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('cn_dev',v); } }catch(e){ v=v||'tam'+Date.now().toString(36); } return v; }
function localMine(){ try{ return JSON.parse(localStorage.getItem('cn_mine')||'{}'); }catch(e){ return {}; } }
function saveLocalMine(o){ try{ localStorage.setItem('cn_mine',JSON.stringify({...localMine(),...o})); }catch(e){} }
function loginView(msg=''){
  $('#app').innerHTML=`<header><div class="hd"><div class="logo"><b>N</b>NEWTECONS · HH12</div></div></header>
  <main><div class="center"><div class="card" style="max-width:420px">
    <div class="eyebrow">Dự án ${PROJECT}</div><h1>Công nhật hằng ngày</h1>
    <p class="muted">Khai báo số lượng công nhật từng ca, chụp ảnh, phân công giám sát và tổng hợp xuất Excel.</p>
    ${msg?`<div class="err">${msg}</div>`:''}
    <button class="btn pri" id="login" style="width:100%">Đăng nhập bằng Google</button></div></div></main>`;
  $('#login').onclick=()=>api.login().catch(e=>loginView(esc(e.message||e)));
}
async function boot(){
  try{ await initStore(); }catch(e){ $('#app').innerHTML=`<div class="center"><div class="err">Không tải được Firebase: ${esc(e.message||e)}</div></div>`; return; }
  api.onUser(async u=>{
    if(!u){ // không đăng nhập: vào thẳng với quyền khai báo
      try{
        S.user={email:'khach:'+devId(),name:'Khách',guest:true}; S.role='khaibao';
        const st=await api.getSettings(); S.settings=Object.assign({},DEF_SETTINGS,st||{}); S.settings.hours=Object.assign({},DEF_SETTINGS.hours,st?.hours||{});
        S.me=localMine(); if(S.me.gsName) S.user.name=S.me.gsName;
        S.loadedOn=today(); await loadDay(today()); route();
      }catch(e){ loginView('Lỗi tải dữ liệu: '+esc(e.message||e)); }
      return; }
    try{
      let role=ADMIN_EMAILS.includes(u.email)?'admin':null, name=u.name;
      if(!role){ const rec=await api.getUser(u.email); if(rec){ role=rec.role; name=rec.name||name; } }
      if(!role){ // lần đầu đăng nhập: tự đăng ký, được khai báo ngay
        await api.saveUser(u.email,{name,role:AUTO_ROLE,auto:true,createdAt:Date.now()}); role=AUTO_ROLE; }
      if(role==='chan'){ loginView(`Tài khoản <b>${esc(u.email)}</b> đã bị quản trị khoá quyền vào web công nhật. Cần mở lại thì báo anh Hiếu.<br><br><button class="btn sm" id="lo2">Đăng xuất</button>`); $('#lo2').onclick=()=>api.logout(); return; }
      S.user={email:u.email,name}; S.role=role;
      const st=await api.getSettings(); S.settings=Object.assign({},DEF_SETTINGS,st||{}); S.settings.hours=Object.assign({},DEF_SETTINGS.hours,st?.hours||{});
      try{ S.me=await api.getMine(u.email); }catch(e){ S.me={}; }
      S.loadedOn=today(); await cleanPhotos(); await loadDay(today()); await refreshPend(); route();
    }catch(e){ loginView('Lỗi tải dữ liệu: '+esc(e.message||e)); }
  });
}
boot();
</script>
