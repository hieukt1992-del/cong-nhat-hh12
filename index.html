<style>
:root{--navy:#0b2545;--blue:#245cad;--blue2:#e8f0fb;--red:#e5322d;--ink:#0f1b2d;--muted:#5b6b85;--line:#d8e1ee;--bg:#f6f9fd;--card:#fff;--ok:#1d7a4a;--ok2:#e6f4ec;--warn:#b7791f;--warn2:#fdf3e1;--bad:#b3261e;--bad2:#fdecea}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:14px}
.logo b{background:#fff;color:var(--navy);width:30px;height:30px;display:grid;place-items:center;border-radius:6px;font-size:17px;letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{color:#c9d6ea;text-decoration:none;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-radius:6px}
nav a.on{color:#fff;background:rgba(255,255,255,.12)}
.who{font-size:13px;color:#c9d6ea;display:flex;align-items:center;gap:8px}
.who button{background:#fff;color:var(--navy);border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-size:26px;margin:4px 0 14px}
h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:42px;width:100%}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}

.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:var(--bad2);color:var(--bad);width:38px;height:38px;border-radius:8px;cursor:pointer;font-weight:700;font-size:18px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blue2);color:var(--blue)}
.badge.ok{background:var(--ok2);color:var(--ok)}.badge.warn{background:var(--warn2);color:var(--warn)}.badge.bad{background:var(--bad2);color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}

.stat .v{font-size:22px;font-weight:700;color:var(--navy)}

.cahd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cahd .n{display:flex;align-items:center;gap:10px}
.num{background:var(--navy);color:#fff;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px}

.rows{display:flex;flex-direction:column;gap:8px}

.up input{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15}
.bar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1;font-size:13px;min-width:160px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}

td.n,th.n{text-align:right}

.gs{border-left:0}
.err{background:var(--bad2);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.err ul{margin:4px 0 0 18px;padding:0}
.lb{position:fixed;inset:0;background:rgba(5,15,30,.9);z-index:50;display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:86vh;border-radius:8px}
.lb button{position:absolute;top:14px;right:14px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
.demo{background:var(--warn2);color:var(--warn);font-size:12px;font-weight:600;text-align:center;padding:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gal img{width:100%;height:140px;object-fit:cover;display:block;cursor:zoom-in}
.gal figcaption{font-size:11px;padding:5px 7px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.step{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.step .sn{font-weight:700;color:var(--navy);font-size:15px}
.step .sn i{font-style:normal;font-size:10px;background:var(--red);color:#fff;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.step .st{font-size:12px;color:var(--muted)}
.step .ss{font-size:12px;font-weight:600;color:var(--blue)}
.step.on{border:2px solid var(--navy);background:var(--blue2)}
.step.done .ss{color:var(--ok)}
.step.lock{background:#eef2f7;cursor:not-allowed}
.step.lock .sn,.step.lock .ss{color:#8a97ab}
.today{font-size:16px;font-weight:700;color:#fff;background:var(--navy);padding:8px 14px;border-radius:8px}
#dash{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.dhd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.dhd .dt{font-size:20px;font-weight:700;color:var(--navy)}
.board{border-collapse:separate;border-spacing:0;min-width:860px}
.board th,.board td{border:1px solid var(--line);vertical-align:top;padding:8px;background:#fff}
.board thead th{background:var(--navy);color:#fff;font-size:13px}
.board .th2{font-weight:400;opacity:.75;font-size:11px;margin-left:4px}
.board th.gsn{background:var(--blue2);color:var(--navy);font-size:13px;text-align:left;white-space:normal}
.board th.gsn small{display:block;font-weight:400;color:var(--muted);margin:2px 0 6px}
.board tfoot th,.board tfoot td{background:var(--blue2);font-size:12px;color:var(--navy)}
.board{table-layout:fixed}
.cn{font-size:22px;font-weight:700;color:var(--navy);line-height:1.1;margin-bottom:4px}
.cn small{font-size:12px;font-weight:600;color:var(--muted)}
.job{font-size:12px;padding:4px 7px;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;line-height:1.35}
.job span{color:var(--muted)}
.job.kt{background:var(--warn2);border-color:#e9c98f}
.job.kt span b{color:var(--warn)}
.empty{color:#b5c0d0;font-size:18px}
.bars h2{margin-bottom:8px}
.bars .b{display:grid;grid-template-columns:minmax(90px,170px) 1fr 86px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bars .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .t{background:var(--blue2);border-radius:5px;height:16px;overflow:hidden}
.bars .f{display:block;height:100%;background:var(--blue);border-radius:5px}
.bars .f.w{background:var(--warn)}
.bars .v{font-weight:700;color:var(--navy);text-align:right}
.bars small.kt{color:var(--warn);font-weight:700}
@media print{header,.noprint,.bar,.demo{display:none!important}main{padding:0;max-width:none}#dash{border:0;padding:0}.tw{overflow:visible}.board{min-width:0}}
@media (max-width:820px){
 .r{grid-template-columns:1fr 1fr 1fr 38px;grid-template-areas:"gs gs gs x" "viec viec viec viec" "vt vt sl sl" "doi doi kt kt" "tu den h h"}
 .r .a1{grid-area:gs}.r .a2{grid-area:viec}.r .a3{grid-area:vt}.r .a4{grid-area:sl}.r .a5{grid-area:tu}.r .a6{grid-area:den}.r .a7{grid-area:h;text-align:left;padding:0 0 10px}.r .a8{grid-area:x}.r .a9{grid-area:doi}.r .a10{grid-area:kt}
 .grid2{grid-template-columns:1fr}
 .steps{grid-template-columns:1fr 1fr}
 h1{font-size:22px}
 nav{flex-wrap:nowrap;overflow-x:auto;order:3;flex-basis:100%}
 nav a{padding:6px 8px;font-size:12px;white-space:nowrap}
 .who{margin-left:auto}
}
</style>

<div id="app"><div class="center"><div class="muted">Đang tải…</div></div></div>

<script type="module">
/* ============ CẤU HÌNH ============
   Dán cấu hình Firebase của dự án vào đây (Firebase console › Project settings › Your apps › Web).
   Để trống apiKey = chạy CHẾ ĐỘ DEMO (lưu trên trình duyệt, chỉ để xem thử). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDfn9scXOzO8kyjUmxW02IfC3VvEOZ0_zU",
  authDomain: "cong-nhat-hh12.firebaseapp.com",
  projectId: "cong-nhat-hh12",
  appId: "1:690556814078:web:77b952cdbc9f4c16bf9baf"
};
const ADMIN_EMAILS = ["hieukt1992@gmail.com"];   // quản trị gốc (khớp với firestore.rules)
const PROJECT = "HH12 Cổ Loa";
/* ================================== */

const DEMO = !FIREBASE_CONFIG.apiKey;
const CAS = [
  {k:'sang',   n:'Sáng',    tc:false},
  {k:'tc_trua',n:'TC trưa', tc:true},
  {k:'chieu',  n:'Chiều',   tc:false},
  {k:'tc_toi', n:'TC tối',  tc:true},
];
const ROLES = {admin:'Quản trị', khaibao:'Khai báo công nhật', xem:'Chỉ xem (giám sát)'};
const DEF_SETTINGS = {
  gs:[{name:'Nguyễn Văn Lập',note:'GS Hoàn thiện'},{name:'Vũ Đức Trung',note:'Kết cấu VP T7–mái'},{name:'Lê Quang Hiếu',note:'CHP NTC'}],
  hours:{sang:['07:00','11:00'],tc_trua:['11:00','13:00'],chieu:['13:00','17:00'],tc_toi:['17:00','21:00']},
  viec:['Dọn vệ sinh sàn','Vận chuyển thiết bị','Bốc xếp vật tư','Phân loại, xếp thiết bị','Hỗ trợ tổ cốp pha','Hỗ trợ hoàn thiện'],
  // Danh sách đội thi công — đồng bộ với web thiết bị HH12 (phieu-hh12)
  doi:['An Bình (hoàn thiện)','An Phát','BCH','DPCONS','Đỗ Đình Tán','ĐTC Khoa','ĐTC Liên Copha','ĐTC Trường','ĐTC Xây Lắp Copha','Đức Hiểu','Gia Phạm','Hải Đăng','Hòa Thùy','Hoàng Văn Tiến','Lê Văn Thuật','Minh Sơn','Nguyễn Đức Kiên','Nhật Minh (hoàn thiện)','NTP Bảo Hưng','NTP Gia Phong','NTP Neo','NTP Quang Thái','NTP Trung Hải','Tổ Thép Lương','Tuấn Anh','UTCONTS'],
  donGia:400000,
  photoRequired:true
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const vn = s => s ? s.split('-').reverse().join('/') : '';
const thu = s => ['CN','T2','T3','T4','T5','T6','T7'][new Date(s+'T00:00').getDay()];
const addDays = (s,n) => { const d=new Date(s+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const fmt = n => (Math.round((+n||0)*100)/100).toLocaleString('vi-VN');
function hrs(tu,den){
  if(!tu||!den) return 0;
  const [a,b]=tu.split(':').map(Number),[c,d]=den.split(':').map(Number);
  let x=a*60+b, y=c*60+d; if(y<x) y+=1440;
  return Math.round((y-x)/60*100)/100;
}
function blankDay(date){
  const ca={}; CAS.forEach(c=>ca[c.k]={rows:[],note:''});
  return {date, ca, locked:false, note:'', photos:{sang:0,tc_trua:0,chieu:0,tc_toi:0}};
}
function caSum(day,k){
  let sl=0,gc=0; (day?.ca?.[k]?.rows||[]).forEach(r=>{const n=+r.sl||0; sl+=n; gc+=n*hrs(r.tu,r.den);});
  return {sl, gc:Math.round(gc*100)/100};
}
/* công quy đổi của 1 dòng: ca chính 0,5 công/người; tăng ca = người×giờ/8 */
const rowQD = (r,c) => c.tc ? (+r.sl||0)*hrs(r.tu,r.den)/8 : (+r.sl||0)/2;
function daySum(day){
  const s=caSum(day,'sang'),t=caSum(day,'tc_trua'),c=caSum(day,'chieu'),o=caSum(day,'tc_toi');
  const congHC=(s.sl+c.sl)/2, gioTC=t.gc+o.gc;
  const ph=day?.photos||{}; const anh=(ph.sang||0)+(ph.tc_trua||0)+(ph.chieu||0)+(ph.tc_toi||0);
  let ktQD=0; CAS.forEach(x=>(day?.ca?.[x.k]?.rows||[]).forEach(r=>{ if(r.kt) ktQD+=rowQD(r,x); }));
  return {sang:s.sl,chieu:c.sl,tcTruaSL:t.sl,tcTruaGio:t.gc,tcToiSL:o.sl,tcToiGio:o.gc,congHC,gioTC,congQD:congHC+gioTC/8,ktQD,anh};
}
const money = n => Math.round(+n||0).toLocaleString('vi-VN')+' đ';

/* ============ LỚP DỮ LIỆU ============ */
let api;
async function initStore(){
  if(DEMO){ api = demoApi(); return; }
  const G='https://www.gstatic.com/firebasejs/10.14.1/';
  const [{initializeApp},A,F] = await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-auth.js'),import(G+'firebase-firestore.js')]);
  const app=initializeApp(FIREBASE_CONFIG), auth=A.getAuth(app), fs=F.getFirestore(app);
  const d=(c,id)=>F.doc(fs,c,id);
  api = {
    onUser: cb => A.onAuthStateChanged(auth, u => cb(u ? {email:u.email.toLowerCase(), name:u.displayName||u.email} : null)),
    async login(){ const p=new A.GoogleAuthProvider(); try{ await A.signInWithPopup(auth,p);}catch(e){ if(/popup/i.test(e.code||'')) await A.signInWithRedirect(auth,p); else throw e; } },
    logout: () => A.signOut(auth),
    async getUser(email){ const s=await F.getDoc(d('cn_users',email)); return s.exists()?s.data():null; },
    async listUsers(){ const q=await F.getDocs(F.collection(fs,'cn_users')); return q.docs.map(x=>({email:x.id,...x.data()})); },
    saveUser: (email,o) => F.setDoc(d('cn_users',email),o),
    delUser: email => F.deleteDoc(d('cn_users',email)),
    async getSettings(){ const s=await F.getDoc(d('cn_meta','settings')); return s.exists()?s.data():null; },
    saveSettings: o => F.setDoc(d('cn_meta','settings'),o),
    async getDay(date){ const s=await F.getDoc(d('cn_days',date)); return s.exists()?s.data():null; },
    saveDay: (date,o) => F.setDoc(d('cn_days',date),o,{merge:true}),
    async listDays(a,b){ const q=await F.getDocs(F.query(F.collection(fs,'cn_days'),F.where('date','>=',a),F.where('date','<=',b))); return q.docs.map(x=>x.data()); },
    async listPhotos(date){ const q=await F.getDocs(F.query(F.collection(fs,'cn_photos'),F.where('date','==',date))); return q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.at-b.at); },
    async addPhoto(p){ const r=await F.addDoc(F.collection(fs,'cn_photos'),p); return r.id; },
    delPhoto: id => F.deleteDoc(d('cn_photos',id)),
  };
}
function demoApi(){
  const K='cnhh12_demo';
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(K))||{}; }catch{ return {}; } };
  const st=Object.assign({days:{},photos:{},users:{},settings:null},load());
  const save=()=>{ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){ toast('Bộ nhớ trình duyệt đầy (chế độ demo) — xoá bớt ảnh.','bad'); } };
  const deep=(a,b)=>{ for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){ a[k]=deep(a[k]&&typeof a[k]==='object'?a[k]:{},b[k]); } else a[k]=b[k]; } return a; };
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  return {
    onUser: cb => cb({email:ADMIN_EMAILS[0], name:'Lê Quang Hiếu (demo)'}),
    login: async()=>{}, logout: async()=>{ alert('Chế độ demo: không có đăng xuất.'); },
    getUser: async e => clone(st.users[e])||null,
    listUsers: async () => Object.entries(st.users).map(([email,o])=>({email,...o})),
    saveUser: async (e,o) => { st.users[e]=o; save(); },
    delUser: async e => { delete st.users[e]; save(); },
    getSettings: async () => clone(st.settings),
    saveSettings: async o => { st.settings=clone(o); save(); },
    getDay: async date => clone(st.days[date])||null,
    saveDay: async (date,o) => { st.days[date]=deep(st.days[date]||{},clone(o)); save(); },
    listDays: async (a,b) => Object.values(st.days).filter(x=>x.date>=a&&x.date<=b).map(clone),
    listPhotos: async date => Object.entries(st.photos).filter(([,p])=>p.date===date).map(([id,p])=>({id,...p})).sort((a,b)=>a.at-b.at),
    addPhoto: async p => { const id='p'+Date.now()+Math.random().toString(36).slice(2,6); st.photos[id]=p; save(); return id; },
    delPhoto: async id => { delete st.photos[id]; save(); },
  };
}

function dirty(){ S.dirty=true; toast('Có thay đổi chưa lưu','warn'); }

function validate(){
  const errs=[];
  CAS.forEach(c=>{
    const rows=S.day.ca[c.k].rows, sm=caSum(S.day,c.k);
    rows.forEach((r,i)=>{
      const p=`${c.n} – dòng ${i+1}:`;
      if(!(+r.sl>0)) errs.push(`${p} chưa nhập số lượng người.`);
      if(!r.gs) errs.push(`${p} chưa chọn giám sát phụ trách.`);
      if(!String(r.viec||'').trim()) errs.push(`${p} chưa ghi công việc.`);
      if(!r.tu||!r.den) errs.push(`${p} thiếu giờ Từ/Đến.`);
      if(r.kt && !r.doi) errs.push(`${p} có tick khấu trừ nhưng chưa chọn đội.`);
      if(r.kt && r.doi==='BCH') errs.push(`${p} BCH không khấu trừ — bỏ tick hoặc chọn đúng đội.`);
    });
    if(S.settings.photoRequired && sm.sl>0 && !S.photos.some(p=>p.ca===c.k)) errs.push(`${c.n}: có ${sm.sl} người nhưng chưa có ảnh công nhật.`);
  });
  const s=daySum(S.day);
  if(s.tcTruaSL>Math.max(s.sang,s.chieu)) errs.push(`TC trưa ${s.tcTruaSL} người, nhiều hơn số người đi ca chính — kiểm tra lại.`);
  if(s.tcToiSL>Math.max(s.sang,s.chieu)) errs.push(`TC tối ${s.tcToiSL} người, nhiều hơn số người đi ca chính — kiểm tra lại.`);
  return errs;
}
async function saveDay(lock){
  if(lock){
    const errs=validate();
    if(errs.length){ $('#errs').innerHTML=`<div class="err"><b>Chưa chốt được, cần bổ sung:</b><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`; $('#errs').scrollIntoView({behavior:'smooth'}); return; }
    if(!confirm(`Chốt công nhật ngày ${vn(S.date)}? Sau khi chốt chỉ quản trị mới mở lại được.`)) return;
  }
  $('#errs').innerHTML='';
  const ca={}; CAS.forEach(c=>{ ca[c.k]={ rows:S.day.ca[c.k].rows.map(r=>({gs:r.gs||'',viec:String(r.viec||'').trim(),vitri:String(r.vitri||'').trim(),doi:r.doi||'',kt:!!r.kt,sl:+r.sl||0,tu:r.tu||'',den:r.den||''})), note:S.day.ca[c.k].note||'' }; });
  const o={date:S.date, ca, note:S.day.note||'', updatedAt:Date.now(), updatedBy:S.user.name};
  if(lock) Object.assign(o,{locked:true,lockedBy:S.user.name,lockedAt:Date.now()});
  try{ await api.saveDay(S.date,o); Object.assign(S.day,o); S.dirty=false; if(lock) viewKhaiBao(); else toast('Đã lưu '+new Date().toLocaleTimeString('vi-VN'),'ok'); }
  catch(e){ toast('Lỗi lưu: '+(e.message||e),'bad'); }
}
async function copyPrev(){
  const k=S.caSel, c=CAS.find(x=>x.k===k);

  for(let i=0;i<14&&!src;i++){ d=addDays(d,-1); const x=await api.getDay(d); if(x?.ca?.[k]?.rows?.length) src=x; }
  if(!src){ toast(`Không tìm thấy ca ${c.n} có dữ liệu trong 14 ngày trước.`,'warn'); return; }

/* ảnh: nén + đóng dấu thời gian */
function loadImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }
async function compress(file,label){
  const url=URL.createObjectURL(file); const img=await loadImg(url); URL.revokeObjectURL(url);
  let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,1280/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d'); x.drawImage(img,0,0,w,h);
  const fs=Math.max(14,Math.round(w/42)), p=Math.round(fs*.45); x.font=`600 ${fs}px sans-serif`; x.textBaseline='top';
  const tw=x.measureText(label).width; x.fillStyle='rgba(11,37,69,.78)'; x.fillRect(0,h-fs-p*2,tw+p*2,fs+p*2); x.fillStyle='#fff'; x.fillText(label,p,h-fs-p);
  let q=.72, out=cv.toDataURL('image/jpeg',q); while(out.length>850000&&q>.3){ q-=.12; out=cv.toDataURL('image/jpeg',q); }
  return out;
}
async function upload(input){
  const k=input.dataset.up, c=CAS.find(x=>x.k===k), files=[...input.files]; input.value='';
  if(!files.length) return;
  const have=S.photos.filter(p=>p.ca===k).length;
  if(have+files.length>8){ toast('Tối đa 8 ảnh mỗi ca.','warn'); return; }
  toast(`Đang tải ${files.length} ảnh…`);
  try{
    for(const f of files){
      const t=new Date(f.lastModified||Date.now()), td=ymd(t);
      const label=`HH12 · Công nhật ${c.n} · ${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())} · ${S.user.name}`;
      const data=await compress(f,label);
      const p={date:S.date,ca:k,data,by:S.user.name,at:Date.now(),takenAt:t.getTime(),takenDate:td};
      p.id=await api.addPhoto(p); S.photos.push(p);
    }
    await syncPhotoCount(k); rerenderCa(k); toast('Đã tải ảnh lên','ok');

function ktByDoi(days){

  return new Map([...m].sort((a,b)=>a[0].localeCompare(b[0],'vi')));
}

async function exportXlsx(){

  // Sheet 2: chi tiết  (C=Ca, D=GS, G=Đội, H=Khấu trừ, I=SL, L=Số giờ, M=Người×giờ, N=Công HC, O=Công QĐ)

    w2.getRow(r2).values=[n,vn(d.date),c.n,x.gs,x.viec,x.vitri,x.doi||'BCH / chung',x.kt?'Có':'',+x.sl||0,x.tu,x.den,hrs(x.tu,x.den),{formula:`I${r2}*L${r2}`},c.tc?'':{formula:`I${r2}*0.5`},c.tc?{formula:`M${r2}/8`}:{formula:`N${r2}`},d.ca[c.k].note||''];

    if(x.kt) w2.getCell(r2,8).font={bold:true,color:{argb:'FFB3261E'}};
    r2++; })));
  w2.getRow(r2).values=['','TỔNG','','','','','','',{formula:`SUM(I5:I${r2-1})`},'','','',{formula:`SUM(M5:M${r2-1})`},{formula:`SUM(N5:N${r2-1})`},{formula:`SUM(O5:O${r2-1})`},''];
  w2.getRow(r2).font={bold:true}; box(w2,5,r2,16); w2.autoFilter={from:{row:4,column:1},to:{row:4,column:16}};
  const last2=r2-1, ref=`'Chi tiet'!`, rg=c=>`${ref}$${c}$5:$${c}$${last2}`;

  // Sheet 3: theo giám sát
  const w3=wb.addWorksheet('Theo giam sat');
  const c3=[['STT',6],['Giám sát',26],['Lượt người sáng+chiều',13],['Công HC',10],['Giờ công TC',11],['Công quy đổi',11],['Trong đó KT đội',12]];
  head(w3,'TỔNG HỢP CÔNG NHẬT THEO GIÁM SÁT',sub,c3);
  const gsNames=[...new Set(days.flatMap(d=>CAS.flatMap(c=>(d.ca?.[c.k]?.rows||[]).map(x=>x.gs))))];
  gsNames.forEach((g,i)=>{ const r=5+i;
    w3.getRow(r).values=[i+1,g,{formula:`SUMPRODUCT((${rg('D')}=B${r})*((${rg('C')}="Sáng")+(${rg('C')}="Chiều"))*${rg('I')})`},{formula:`SUMIFS(${rg('N')},${rg('D')},B${r})`},{formula:`SUMPRODUCT((${rg('D')}=B${r})*((${rg('C')}="TC trưa")+(${rg('C')}="TC tối"))*${rg('M')})`},{formula:`D${r}+E${r}/8`},{formula:`SUMIFS(${rg('O')},${rg('D')},B${r},${rg('H')},"Có")`}]; });
  const T3=5+gsNames.length; w3.getRow(T3).values=['','TỔNG',...'CDEFG'.split('').map(c=>({formula:`SUM(${c}5:${c}${T3-1})`}))]; w3.getRow(T3).font={bold:true};
  box(w3,5,T3,7);

  // Sheet 4: khấu trừ theo đội
  const w4=wb.addWorksheet('Khau tru doi');
  const c4=[['STT',6],['Đội thi công',28],['Lượt người ca chính',13],['Công HC',10],['Giờ công TC',11],['Công quy đổi',11],['Đơn giá (đ/công)',14],['Thành tiền (đ)',16]];
  head(w4,'TỔNG HỢP CÔNG NHẬT KHẤU TRỪ ĐỘI THI CÔNG',sub,c4);
  const doiKT=[...ktByDoi(days).keys()];
  doiKT.forEach((g,i)=>{ const r=5+i;
    w4.getRow(r).values=[i+1,g,{formula:`SUMPRODUCT((${rg('G')}=B${r})*(${rg('H')}="Có")*((${rg('C')}="Sáng")+(${rg('C')}="Chiều"))*${rg('I')})`},{formula:`SUMIFS(${rg('N')},${rg('G')},B${r},${rg('H')},"Có")`},{formula:`SUMPRODUCT((${rg('G')}=B${r})*(${rg('H')}="Có")*((${rg('C')}="TC trưa")+(${rg('C')}="TC tối"))*${rg('M')})`},{formula:`D${r}+E${r}/8`},+S.settings.donGia||0,{formula:`ROUND(F${r}*G${r},0)`}]; });
  const T4=5+doiKT.length; w4.getRow(T4).values=['','TỔNG',...'CDEF'.split('').map(c=>({formula:`SUM(${c}5:${c}${T4-1})`})),'',{formula:`SUM(H5:H${T4-1})`}]; w4.getRow(T4).font={bold:true};
  box(w4,5,T4,8); for(let r=5;r<=T4;r++){ w4.getCell(r,7).numFmt='#,##0'; w4.getCell(r,8).numFmt='#,##0'; }
  // chi tiết từng lượt khấu trừ, gom theo đội — để gửi đội đối chiếu
  let r4=T4+3; w4.getCell(r4-1,1).value='CHI TIẾT CÁC LƯỢT KHẤU TRỪ'; w4.getCell(r4-1,1).font={bold:true,color:{argb:NAVY}};
  ['STT','Đội thi công','Ngày','Ca','Công việc – vị trí','SL','Giờ','Công quy đổi'].forEach((h,i)=>{ const x=w4.getCell(r4,i+1); x.value=h; x.font={bold:true,color:{argb:'FFFFFFFF'}}; x.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; x.border=B; });
  const det=[]; days.forEach(d=>CAS.forEach(c=>(d.ca?.[c.k]?.rows||[]).forEach(x=>{ if(x.kt) det.push({d,c,x}); })));
  det.sort((a,b)=>(a.x.doi||'').localeCompare(b.x.doi||'','vi')||(a.d.date<b.d.date?-1:a.d.date>b.d.date?1:0));
  const r4s=r4+1; det.forEach((o,i)=>{ r4++; w4.getRow(r4).values=[i+1,o.x.doi,vn(o.d.date),o.c.n,`${o.x.viec}${o.x.vitri?' – '+o.x.vitri:''} (GS ${o.x.gs})`,+o.x.sl||0,`${o.x.tu}–${o.x.den}`,Math.round(rowQD(o.x,o.c)*1000)/1000]; });
  if(det.length) box(w4,r4s,r4,8);

  const buf=await wb.xlsx.writeBuffer();
  const name=`HH12_CONG-NHAT_${S.sumFrom.replace(/-/g,'')}-${S.sumTo.replace(/-/g,'')}.xlsx`;
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:name,data:buf}); toast('Đã xuất Excel','ok'); }catch(e){ toast(e.code==='declined'?'Đã huỷ tải file':'Không tải được: '+(e.message||e.code),'warn'); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('Đã xuất Excel','ok');
}

/* ============ 5. CÀI ĐẶT ============ */
async function viewCaiDat(){
  const users=await api.listUsers(); const s=S.settings;
  shell(`<div class="eyebrow">Quản trị</div><h1>Cài đặt</h1>
  <div class="grid2">
  <section class="card"><h2>Danh sách giám sát</h2><p class="muted">Mỗi dòng 1 người: <b>Họ tên | phụ trách</b></p>
    <textarea id="gs" rows="7">${esc(s.gs.map(g=>g.name+(g.note?' | '+g.note:'')).join('\n'))}</textarea>
    <h2 style="margin-top:14px">Công việc hay dùng</h2><p class="muted">Mỗi dòng 1 việc — hiện gợi ý khi gõ.</p>
    <textarea id="viec" rows="6">${esc(s.viec.join('\n'))}</textarea>
    <h2 style="margin-top:14px">Đội thi công</h2><p class="muted">Đồng bộ với web thiết bị HH12 — mỗi dòng 1 đội.</p>
    <textarea id="doi" rows="8">${esc(s.doi.join('\n'))}</textarea></section>
  <section class="card"><h2>Giờ mặc định từng ca</h2><p class="muted">Tự điền khi thêm dòng, sửa được ở từng dòng.</p>
    ${CAS.map(c=>`<div class="row" style="margin-bottom:8px"><span style="width:80px;padding-bottom:10px;font-weight:600">${c.n}</span><label class="f" style="width:120px">Từ<input type="time" id="h1-${c.k}" value="${s.hours[c.k][0]}"></label><label class="f" style="width:120px">Đến<input type="time" id="h2-${c.k}" value="${s.hours[c.k][1]}"></label></div>`).join('')}
    <label class="f" style="margin-top:10px;max-width:260px">Đơn giá công nhật để tính khấu trừ (đ/công)<input type="number" id="dg" min="0" step="1000" value="${+s.donGia||0}"></label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="preq" style="width:20px;min-height:20px" ${s.photoRequired?'checked':''}> Bắt buộc có ảnh mỗi ca có người mới được chốt ngày</label>
    <div class="row" style="margin-top:14px"><button class="btn pri" id="saveS">Lưu cài đặt</button><span id="msg"></span></div></section>
  </div>
  <section class="card"><h2>Người dùng được vào web</h2><p class="muted">Đăng nhập bằng tài khoản Google. Chưa có trong danh sách thì không xem được gì.</p>
    <div class="row" style="margin:10px 0">
      <label class="f" style="flex:2;min-width:200px">Email Google<input id="ue" type="email" placeholder="ten@gmail.com"></label>
      <label class="f" style="flex:2;min-width:160px">Họ tên<input id="un"></label>
      <label class="f" style="flex:1;min-width:170px">Vai trò<select id="ur">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k==='khaibao'?'selected':''}>${v}</option>`).join('')}</select></label>
      <button class="btn blue" id="uadd">Thêm</button></div>
    <div class="tw"><table><tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th></th></tr>
      ${ADMIN_EMAILS.map(e=>`<tr><td>${esc(e)}</td><td>—</td><td>Quản trị gốc</td><td></td></tr>`).join('')}
      ${users.filter(u=>!ADMIN_EMAILS.includes(u.email)).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(ROLES[u.role]||u.role)}</td><td><button class="btn sm" data-udel="${esc(u.email)}">Xoá</button></td></tr>`).join('')}
    </table></div></section>`);
  $('#saveS').onclick=async()=>{
    const gs=$('#gs').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [n,...r]=l.split('|'); return {name:n.trim(),note:r.join('|').trim()}; });
    const hours={}; CAS.forEach(c=>hours[c.k]=[$('#h1-'+c.k).value,$('#h2-'+c.k).value]);
    S.settings={gs,hours,viec:$('#viec').value.split('\n').map(x=>x.trim()).filter(Boolean),doi:$('#doi').value.split('\n').map(x=>x.trim()).filter(Boolean),donGia:Math.max(0,+$('#dg').value||0),photoRequired:$('#preq').checked};
    await api.saveSettings(S.settings); toast('Đã lưu cài đặt','ok');
  };
  $('#uadd').onclick=async()=>{ const e=$('#ue').value.trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(e)){ toast('Email không hợp lệ','bad'); return; }
    await api.saveUser(e,{name:$('#un').value.trim()||e,role:$('#ur').value}); viewCaiDat(); };
  $('main').addEventListener('click',async ev=>{ const e=ev.target.dataset.udel; if(e&&confirm('Xoá quyền của '+e+'?')){ await api.delUser(e); viewCaiDat(); } });
}

/* ============ KHỞI ĐỘNG ============ */
function loginView(msg=''){
  $('#app').innerHTML=`<header><div class="hd"><div class="logo"><b>N</b>NEWTECONS · HH12</div></div></header>
  <main><div class="center"><div class="card" style="max-width:420px">
    <div class="eyebrow">Dự án ${PROJECT}</div><h1>Công nhật hằng ngày</h1>
    <p class="muted">Khai báo số lượng công nhật từng ca, chụp ảnh, phân công giám sát và tổng hợp xuất Excel.</p>
    ${msg?`<div class="err">${msg}</div>`:''}
    <button class="btn pri" id="login" style="width:100%">Đăng nhập bằng Google</button></div></div></main>`;
  $('#login').onclick=()=>api.login().catch(e=>loginView(esc(e.message||e)));
}
async function boot(){
  try{ await initStore(); }catch(e){ $('#app').innerHTML=`<div class="center"><div class="err">Không tải được Firebase: ${esc(e.message||e)}</div></div>`; return; }
  api.onUser(async u=>{
    if(!u){ S.user=null; loginView(); return; }
    try{
      let role=ADMIN_EMAILS.includes(u.email)?'admin':null, name=u.name;
      if(!role){ const rec=await api.getUser(u.email); if(rec){ role=rec.role; name=rec.name||name; } }
      if(!role){ loginView(`Tài khoản <b>${esc(u.email)}</b> chưa được cấp quyền. Báo quản trị (anh Hiếu) thêm email này vào mục Cài đặt.<br><br><button class="btn sm" id="lo2">Đăng xuất</button>`); $('#lo2').onclick=()=>api.logout(); return; }
      S.user={email:u.email,name}; S.role=role;
      const st=await api.getSettings(); S.settings=Object.assign({},DEF_SETTINGS,st||{}); S.settings.hours=Object.assign({},DEF_SETTINGS.hours,st?.hours||{});
      await loadDay(today()); route();
    }catch(e){ loginView('Lỗi tải dữ liệu: '+esc(e.message||e)); }
  });
}
boot();
</script>
